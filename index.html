<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetEstudo</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16425b"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VetEstudo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: clínico e acolhedor, como o hospital veterinário escola de um bom curso
   IDEA: um mapa do curso; cada disciplina é um "mundo" com cor e emblema próprios da sua área
   PICTURE: no mapa, a trilha de semestres com as disciplinas; no mundo, faixa cheia na cor da área com o emblema grande e repetido
   COLOUR and TYPE: papel branco, tinta azul-petróleo; cada área tem uma cor forte; Archivo + Source Sans 3
   LAYOUT: faixa de título, trilha de semestres em grade; mundo = faixa-herói, abas, painel; tudo empilha abaixo de 600px */
:root{color-scheme:light dark;
--bg:light-dark(#fbfbf9,#0d171e);--paper:light-dark(#ffffff,#13212b);--ink:light-dark(#14212b,#e8eef2);
--soft:light-dark(#566673,#9fb1bd);--line:light-dark(#dfe5e8,#26394a);--band:light-dark(#16425b,#0a2638);
--tint:light-dark(#e8f0f4,#183245);--acc:light-dark(#c9452a,#ff7a5a);--ok:light-dark(#1f7a4d,#5fd39a);--c:#16425b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.08;text-wrap:balance;margin:0}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
a{color:inherit}
button{font:600 16px Archivo,sans-serif;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button.pri{background:var(--c);color:#fff;border-color:var(--c)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.fc:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;margin-top:4px;font:16px "Source Sans 3",sans-serif;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
textarea{min-height:220px;resize:vertical;line-height:1.5}
label{display:block;font-weight:600;font-size:15px}
.note{font-size:14px;color:var(--soft);margin:10px 0 0}
/* mapa */
.top{background:var(--band);color:#fff}
.topg{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:center}.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mosaic span{aspect-ratio:1;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18)}.mosaic svg{width:55%;height:55%}@media(max-width:820px){.topg{grid-template-columns:minmax(0,1fr)}.mosaic{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.mosaic span{border-radius:10px}}
.top h1{font-size:clamp(32px,5vw,50px);font-weight:800;max-width:18ch}
.top p{color:#cfe0ea;max-width:60ch;margin:10px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px;margin-top:22px}
.stats b{display:block;font:800 30px/1 Archivo,sans-serif}.stats span{font-size:14px;color:#cfe0ea}
.tools-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-top:22px}
.tools-row label{flex:1 1 260px;color:#fff}.tools-row input{background:#fff;color:#14212b;border:0}
.resume{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#14212b;text-decoration:none;font:600 16px Archivo,sans-serif;padding:10px 16px;border-radius:10px;min-height:44px}
.sem{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.sem h2{font-size:22px}.sem .h{color:var(--soft);font-size:14px}
.node{width:44px;height:44px;border-radius:50%;background:var(--band);color:#fff;display:grid;place-items:center;font:800 18px Archivo,sans-serif;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:flex-start;text-decoration:none;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--c) 9%,var(--paper));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));min-height:96px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .em{flex:none;width:44px;height:44px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center}
.tile .em svg{width:30px;height:30px}
.tile b{display:block;font:700 15px/1.25 Archivo,sans-serif}
.tile small{display:block;color:var(--soft);font-size:13px;margin-top:3px}
.mini{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--soft);margin:18px 0 4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
/* mundo */
.hero{background:var(--c);color:#fff;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;min-height:300px}
.back{display:inline-flex;align-items:center;min-height:44px;color:#fff;font:600 15px Archivo,sans-serif;text-decoration:none;opacity:.9}
.hero h1{font-size:clamp(32px,4.6vw,50px);font-weight:800;margin-top:6px}
.hero .meta{margin-top:10px;font-weight:600;opacity:.9}
.hero p{max-width:56ch;margin:10px 0 0;opacity:.92}
.hstats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px}.hstats b{font:800 26px Archivo,sans-serif;display:block;line-height:1}.hstats span{font-size:14px;opacity:.85}
.art{height:280px;position:relative}.art svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{flex:none;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 16px}
.tabs button[aria-selected=true]{border-bottom-color:var(--c);color:var(--c)}
:root[data-theme=dark] .tabs button[aria-selected=true]{color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tabs button[aria-selected=true]{color:var(--ink)}}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.topic{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.topic h3{font-size:19px}.topic p{margin:0;flex:1}
.topic.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--paper))}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--c)}
.flash{max-width:720px;margin:0 auto;perspective:1200px}
.fc{position:relative;height:300px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);background:var(--paper)}
.face.back{transform:rotateY(180deg);background:var(--c);color:#fff;border-color:var(--c)}
.face h3{font-size:clamp(21px,3.2vw,28px)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.opts{display:grid;gap:10px;margin-top:16px}
.opts button{text-align:left;font-family:"Source Sans 3",sans-serif;font-size:17px;font-weight:600}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.tag{font-size:14px;color:var(--soft)}
.big{font:800 clamp(40px,7vw,60px)/1 Archivo,sans-serif;white-space:nowrap}.big small{font-size:.38em;font-weight:600;margin-left:6px}
.tool{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin-bottom:22px}
.tool h3{font-size:21px}.sub{color:var(--soft);margin:2px 0 14px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.result{background:color-mix(in srgb,var(--c) 10%,var(--paper));border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;font-size:15px}.row b{white-space:nowrap}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-family:Archivo,sans-serif;background:var(--tint)}td.n{white-space:nowrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.log{display:grid;gap:10px;margin-top:14px}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.entry p{margin:2px 0 0;white-space:pre-wrap}.entry button{min-height:36px;padding:6px 12px;font-size:14px}
.empty{color:var(--soft);padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.saved{font-size:14px;color:var(--ok);min-height:20px}
footer{color:var(--soft);font-size:14px;padding:24px max(5vw,16px) 40px}
pre,.scroll{overflow-x:auto}html{scroll-padding-top:72px}
@media(max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr);min-height:0}.art{height:130px}.tool,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.sem{grid-template-columns:minmax(0,1fr);gap:10px}.sem>div:first-child{display:flex;gap:12px;align-items:center}.node{margin:0}.grid2{grid-template-columns:minmax(0,1fr)}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding:10px 12px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:600}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.fc,.tile{transition:none}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>

<script>
{
const DATA=[{"id":"anat-estrutural","nome":"Anatomia Estrutural Animal","sem":1,"h":65,"area":"morfo","kind":"conteudo","desc":"Osteologia, artrologia e miologia comparada das espécies domésticas, com a linguagem anatômica que você vai usar no curso inteiro.","tools":[],"top":[["Planos e termos de posição","Plano mediano divide o corpo em metades direita e esquerda; sagitais são paralelos a ele; dorsal é paralelo ao dorso; transversal corta perpendicular ao eixo longo. Na cabeça usa-se rostral em vez de cranial. Nos membros, proximal/distal; abaixo do carpo é palmar e abaixo do tarso é plantar."],["Osteologia","Ossos longos, curtos, planos, irregulares, sesamoides e pneumáticos. Esqueleto axial (crânio, coluna, costelas, esterno) e apendicular (membros). Equinos e ruminantes não têm clavícula; no cão ela é vestigial."],["Fórmulas vertebrais","Cão e gato: C7 T13 L7 S3. Equino: C7 T18 L6 S5. Bovino: C7 T13 L6 S5. Suíno: C7 T14–15 L6–7 S4. O número de vértebras caudais varia muito."],["Artrologia","Articulações fibrosas (suturas), cartilagíneas (sínfises, sincondroses) e sinoviais. A sinovial tem cápsula articular, membrana sinovial, líquido sinovial e cartilagem articular hialina. Tipos: gínglimo, esferoide, trocoide, plana, condilar."],["Miologia","Músculo esquelético com origem (fixa) e inserção (móvel); agonistas, antagonistas e sinergistas. O equino tem aparelho de sustentação passiva, com travamento da patela, que permite descansar em pé."]],"qn":100},{"id":"bioquimica","nome":"Bioquímica e Biofísica em Animais","sem":1,"h":66,"area":"bio","kind":"conteudo","desc":"Moléculas, enzimas, metabolismo energético e os princípios físicos de membranas e soluções.","tools":[],"top":[["pH e tampões","O principal tampão do sangue é o sistema bicarbonato/ácido carbônico. A equação de Henderson-Hasselbalch relaciona pH, pKa e a razão base/ácido."],["Enzimas","Km é a concentração de substrato em que a velocidade chega à metade da Vmax. Na inibição competitiva, o Km aparente aumenta e a Vmax não muda; na não competitiva, a Vmax cai."],["Metabolismo de carboidratos","A glicólise ocorre no citosol e rende 2 ATP líquidos por glicose. O ciclo de Krebs ocorre na matriz mitocondrial; a cadeia respiratória, na membrana mitocondrial interna."],["Lipídios e corpos cetônicos","Em balanço energético negativo, a oxidação de ácidos graxos gera corpos cetônicos (acetoacetato, β-hidroxibutirato, acetona). O β-hidroxibutirato é o mais dosado no diagnóstico de cetose em vacas."],["Biofísica de membranas","Osmose é o movimento de água para o meio mais concentrado. A Na+/K+-ATPase leva 3 Na+ para fora e 2 K+ para dentro, mantendo o potencial de repouso."]],"qn":100},{"id":"citogen","nome":"Citologia, Genética e Embriologia","sem":1,"h":65,"area":"bio","kind":"conteudo","desc":"Da célula à formação do embrião: organelas, divisão celular, herança e placentação.","tools":[],"top":[["Organelas","Mitocôndria (energia), retículo endoplasmático rugoso (proteínas) e liso (lipídios, detoxificação), complexo de Golgi (empacotamento) e lisossomos (digestão intracelular)."],["Divisão celular","A mitose gera duas células idênticas. A meiose gera quatro células haploides; o crossing-over ocorre na prófase I e aumenta a variabilidade genética."],["Genética","Aa × Aa gera proporção fenotípica 3:1 com dominância completa. Herança ligada ao X explica por que gatos tricolores são quase sempre fêmeas. Números diploides: cão 78, gato 38, bovino 60, equino 64, suíno 38."],["Folhetos embrionários","Ectoderma: pele e sistema nervoso. Mesoderma: músculos, ossos, sistema cardiovascular e urogenital. Endoderma: epitélio dos tratos digestório e respiratório."],["Placentação","Epiteliocorial difusa (égua, porca), sinepiteliocorial cotiledonária (ruminantes), endoteliocorial zonária (cadela, gata) e hemocorial discoide (primatas, roedores). Quanto mais camadas, menos anticorpos passam ao feto."]],"qn":100},{"id":"deontologia","nome":"Deontologia, Bioterismo e Medicina Veterinária Legal","sem":1,"h":66,"area":"prof","kind":"conteudo","desc":"Ética e legislação da profissão, uso de animais em ensino e pesquisa e a atuação do veterinário como perito.","tools":[],"top":[["A profissão","A Lei 5.517/1968 regulamenta o exercício da Medicina Veterinária e cria o CFMV e os CRMVs. O CFMV normatiza; os CRMVs registram e fiscalizam nos estados."],["Código de Ética","O Código de Ética do Médico-Veterinário (Resolução CFMV 1.138/2016) trata de deveres, sigilo profissional, relação com clientes e colegas, publicidade e honorários."],["Bioterismo e os 3Rs","Russell e Burch (1959) propuseram os 3Rs: substituição (Replacement), redução (Reduction) e refinamento (Refinement)."],["Lei Arouca","A Lei 11.794/2008 regula o uso científico de animais, cria o CONCEA e exige uma CEUA em cada instituição para aprovar protocolos."],["Medicina Veterinária Legal","Perícias, laudos e pareceres. Maus-tratos são crime pela Lei 9.605/1998, art. 32; a Lei 14.064/2020 aumentou a pena para cães e gatos para reclusão de 2 a 5 anos."]],"qn":114},{"id":"ecozoo","nome":"Ecologia, Zoologia e Bem-estar Animal","sem":1,"h":65,"area":"saude","kind":"conteudo","desc":"Como os animais se classificam, se relacionam com o ambiente e como avaliar se estão bem.","tools":[],"top":[["Ecologia","Níveis: indivíduo, população, comunidade, ecossistema e biosfera. Relações: mutualismo (ambos ganham), comensalismo (um ganha, o outro é indiferente), parasitismo (um ganha, o outro perde), predação e competição."],["Classificação zoológica","Reino, filo, classe, ordem, família, gênero e espécie. O nome científico é binomial, em itálico, com gênero em maiúscula: Bos taurus, Canis lupus familiaris."],["Cinco Liberdades","Livre de fome e sede; de desconforto; de dor, lesão e doença; para expressar comportamento natural; de medo e estresse."],["Cinco Domínios","Modelo de Mellor: nutrição, ambiente, saúde, interações comportamentais e estado mental. Os quatro primeiros influenciam o quinto, que é a experiência do animal."],["Indicadores de bem-estar","Baseados no animal (escore corporal, lesões, comportamento) e no ambiente (espaço, recursos). Estereotipias, como a aerofagia em equinos, indicam bem-estar comprometido."]],"qn":108},{"id":"labvida-1","nome":"LabVida em Medicina Veterinária I","sem":1,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"anat-sistemica","nome":"Anatomia Sistêmica Animal","sem":2,"h":65,"area":"morfo","kind":"conteudo","desc":"Os sistemas orgânicos comparados: digestório, respiratório, cardiovascular, urinário, nervoso e reprodutor.","tools":[],"top":[["Digestório comparado","Monogástricos (cão, gato, suíno), ruminantes com rúmen, retículo, omaso e abomaso, e o equino, fermentador pós-gástrico com ceco e cólon volumosos."],["Cardiovascular","Coração com quatro câmaras. Valva atrioventricular direita: tricúspide; esquerda: mitral (bicúspide). No feto, o ducto arterioso liga a artéria pulmonar à aorta e o forame oval liga os átrios."],["Urinário","Rim do bovino é lobulado externamente; cão, gato e pequenos ruminantes têm rim liso e unipiramidal. O equino tem rim direito em forma de coração."],["Nervoso","Sistema nervoso central (encéfalo e medula) e periférico, com 12 pares de nervos cranianos e nervos espinhais."],["Reprodutor","Útero bicorno nas domésticas. Pênis fibroelástico com flexura sigmoide em ruminantes e suínos; musculocavernoso no equino. O cão tem osso peniano."]],"qn":100},{"id":"histologia","nome":"Histologia Veterinária","sem":2,"h":65,"area":"morfo","kind":"conteudo","desc":"Os quatro tecidos básicos e como reconhecê-los ao microscópio.","tools":[],"top":[["Tecido epitelial","Classificado pelo número de camadas e forma das células. Pele: pavimentoso estratificado queratinizado. Bexiga: de transição (urotélio). Traqueia: pseudoestratificado colunar ciliado com células caliciformes."],["Tecido conjuntivo","Fibroblastos e colágeno tipo I. Cartilagens: hialina (articulações, traqueia), elástica (orelha, epiglote) e fibrosa (discos, meniscos). Osso: osteoblastos formam, osteócitos mantêm, osteoclastos reabsorvem."],["Tecido muscular","Esquelético: estriado, multinucleado com núcleos periféricos. Cardíaco: estriado, núcleo central, discos intercalares. Liso: sem estrias, fusiforme."],["Tecido nervoso","Neurônios e glia. No SNC, oligodendrócitos formam mielina; no SNP, células de Schwann. Astrócitos dão suporte e participam da barreira hematoencefálica."],["Coloração HE","Hematoxilina cora estruturas basófilas, como núcleos, em azul-arroxeado; eosina cora citoplasma e colágeno em rosa."]],"qn":115},{"id":"microbiologia","nome":"Microbiologia Veterinária","sem":2,"h":65,"area":"micro","kind":"conteudo","desc":"Bactérias, fungos e vírus de importância veterinária, como identificá-los e controlá-los.","tools":[],"top":[["Coloração de Gram","Gram-positivas têm parede espessa de peptidoglicano e ficam roxas. Gram-negativas têm parede fina e membrana externa com LPS (endotoxina) e ficam rosa."],["Bactérias formadoras de esporos","Clostridium e Bacillus formam endósporos resistentes ao calor e desinfetantes. Clostridium tetani causa tétano; Clostridium chauvoei, carbúnculo sintomático."],["Fungos","Leveduras como Malassezia pachydermatis (otite canina) e Candida. Dermatófitos como Microsporum canis, comum em gatos, e Trichophyton."],["Vírus","Vírus não envelopados (parvovírus, calicivírus) resistem muito no ambiente; envelopados (cinomose, coronavírus) são inativados mais facilmente por detergentes e desinfetantes."],["Esterilização e resistência","Autoclave: vapor sob pressão, classicamente 121 °C por cerca de 15 minutos. O uso racional de antimicrobianos e o antibiograma combatem a resistência."]],"qn":100},{"id":"nutricao","nome":"Nutrição Animal, Forragicultura e Pastagens","sem":2,"h":65,"area":"prod","kind":"conteudo","desc":"Nutrientes, digestão de ruminantes e não ruminantes, forrageiras tropicais e manejo de pastagens.","tools":["ner"],"top":[["Nutrientes e análise","Água, carboidratos, proteínas, lipídios, minerais e vitaminas. Método de Weende e sistema de Van Soest: FDN representa a parede celular (celulose, hemicelulose, lignina); FDA, celulose e lignina."],["Ruminantes","Microbiota ruminal fermenta fibra em ácidos graxos voláteis: acetato (predomina em dietas fibrosas), propionato (precursor de glicose) e butirato. A ureia é fonte de nitrogênio não proteico."],["Cães e gatos","Gatos são carnívoros estritos: precisam de taurina, ácido araquidônico e vitamina A pré-formada. Necessidade energética de repouso: 70 × peso^0,75 kcal/dia."],["Forrageiras tropicais","Predominam gramíneas C4, como Urochloa (Brachiaria) e Panicum (Mombaça, Tanzânia), mais produtivas no calor que as C3."],["Manejo de pastagens","Lotação contínua ou rotacionada. Respeitar altura de entrada e saída de cada forrageira preserva rebrota e evita degradação."]],"qn":117},{"id":"parasitologia","nome":"Parasitologia Veterinária","sem":2,"h":65,"area":"micro","kind":"conteudo","desc":"Helmintos, protozoários e artrópodes: ciclos, hospedeiros e diagnóstico laboratorial.","tools":[],"top":[["Conceitos","Hospedeiro definitivo abriga a fase sexuada ou adulta; intermediário, as fases larvais. Ciclo direto (monoxeno) ou indireto (heteroxeno). Vetor transmite o agente."],["Helmintos","Nematódeos: Haemonchus contortus causa anemia em pequenos ruminantes (avaliada pelo FAMACHA). Cestódeos: Dipylidium caninum, com pulga como hospedeiro intermediário. Trematódeos: Fasciola hepatica, com caramujo Lymnaea."],["Protozoários","Toxoplasma gondii (felídeos são hospedeiros definitivos), Babesia, Giardia e Eimeria (coccidiose em aves e bovinos)."],["Artrópodes","Rhipicephalus microplus, carrapato-do-boi, de ciclo monoxeno. Rhipicephalus sanguineus, carrapato-marrom-do-cão. Ctenocephalides felis, pulga de cães e gatos."],["Diagnóstico","Contagem de ovos por grama (OPG) pela técnica de McMaster; flutuação (Willis) para ovos leves; sedimentação para trematódeos; Baermann para larvas de vermes pulmonares."]],"qn":100},{"id":"labvida-2","nome":"LabVida em Medicina Veterinária II","sem":2,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"fisiologia","nome":"Fisiologia e Imunologia Veterinária","sem":3,"h":66,"area":"bio","kind":"conteudo","desc":"Como os sistemas funcionam e como o organismo se defende.","tools":[],"top":[["Cardiovascular","Débito cardíaco = frequência cardíaca × volume sistólico. Lei de Frank-Starling: maior enchimento, maior força de contração."],["Respiratório e renal","O principal estímulo químico da ventilação é o aumento de CO2/H+. No rim, o ADH aumenta a reabsorção de água no ducto coletor e a aldosterona aumenta a reabsorção de sódio."],["Endócrino","Eixo hipotálamo-hipófise-glândulas. A ocitocina promove ejeção do leite e contração uterina; a prolactina, a produção de leite."],["Imunidade","Inata (barreiras, neutrófilos, macrófagos, complemento) e adaptativa (linfócitos B e T). IgG: maior concentração sérica; IgM: primeira na resposta primária; IgA: mucosas; IgE: alergias e parasitas."],["Colostro","Em ruminantes, equinos e suínos a placenta não deixa passar anticorpos. O neonato absorve imunoglobulinas do colostro pelo intestino, sobretudo nas primeiras horas de vida."]],"qn":100},{"id":"gestao","nome":"Gestão, Empreendedorismo e Extensão Rural","sem":3,"h":66,"area":"prof","kind":"conteudo","desc":"Planejar e administrar um negócio veterinário e levar conhecimento técnico ao produtor.","tools":["pe"],"top":[["Plano de negócios","Sumário executivo, análise de mercado, plano de marketing, plano operacional e plano financeiro. O Business Model Canvas resume o modelo em 9 blocos."],["Análise SWOT (FOFA)","Forças e fraquezas são fatores internos; oportunidades e ameaças, externos."],["Custos e preço","Custos fixos (aluguel, salários) não variam com o número de atendimentos; variáveis (materiais, medicamentos) sim. Margem de contribuição = preço − custo variável."],["Ponto de equilíbrio","Quantidade mínima para cobrir os custos: custos fixos ÷ (preço − custo variável unitário). Abaixo dele há prejuízo."],["Extensão rural","ATER: Assistência Técnica e Extensão Rural. Metodologias participativas, dias de campo, unidades demonstrativas e escuta do produtor."]],"qn":109},{"id":"prod1","nome":"Produção e Melhoramento Animal I","sem":3,"h":65,"area":"prod","kind":"conteudo","desc":"Fundamentos do melhoramento genético e produção de bovinos de corte e de leite.","tools":[],"top":[["Herdabilidade","h² é a fração da variação de uma característica explicada por genes aditivos. Características de crescimento têm h² moderada; reprodutivas, baixa."],["Ganho genético","Resposta à seleção = h² × diferencial de seleção, por geração. Dividindo pelo intervalo de gerações obtém-se o ganho por ano."],["Cruzamentos e heterose","A heterose (vigor híbrido) é mais expressiva em características de baixa herdabilidade, como as reprodutivas. Girolando: Gir × Holandês."],["Raças","Zebuínas (Bos indicus), adaptadas ao calor: Nelore, Gir, Guzerá. Taurinas (Bos taurus): Holandesa, Jersey, Angus."],["Índices zootécnicos","Taxa de natalidade, idade ao primeiro parto e intervalo entre partos, idealmente perto de 12 meses. IATF permite inseminar lotes sem observar cio."]],"qn":100},{"id":"prod2","nome":"Produção e Melhoramento Animal II","sem":3,"h":65,"area":"prod","kind":"conteudo","desc":"Produção de aves, suínos, pequenos ruminantes e equinos, com foco em índices e biosseguridade.","tools":[],"top":[["Avicultura","Frango de corte abatido por volta de 42 dias, com conversão alimentar perto de 1,6. Conversão alimentar = ração consumida ÷ ganho de peso. Galinhas poedeiras em ciclos de postura."],["Suinocultura","Fases: maternidade, creche, crescimento e terminação. Gestação de cerca de 114 dias e desmame em geral entre 21 e 28 dias. Leitões recebem ferro injetável para evitar anemia."],["Ovinos e caprinos","No Nordeste destacam-se ovinos deslanados (Santa Inês, Morada Nova) e caprinos como Anglo-Nubiana, Boer (corte) e Saanen (leite)."],["Equideocultura","Manejo reprodutivo sazonal da égua, nutrição baseada em volumoso e cuidados com casco e dentes."],["Biosseguridade","Controle de acesso, vazio sanitário, todos dentro/todos fora, quarentena e controle de roedores e aves silvestres."]],"qn":101},{"id":"tpoa-ovos","nome":"TPOA: Ovos, Pescado e Mel","sem":3,"h":65,"area":"tpoa","kind":"conteudo","desc":"Tecnologia e qualidade de ovos, pescado e mel, do produtor à mesa.","tools":[],"top":[["Ovo","Casca, membranas, câmara de ar, albúmen e gema. A câmara de ar aumenta com o envelhecimento. Ovoscopia avalia casca, câmara de ar e defeitos."],["Qualidade do ovo","Unidade Haugh relaciona altura do albúmen denso e peso do ovo: quanto maior, mais fresco."],["Pescado fresco","Olhos brilhantes e salientes, brânquias vermelhas e úmidas, escamas aderidas, carne firme. Deterioração aumenta bases voláteis totais (BVT)."],["Histamina","Peixes escombrídeos (atum, cavala) mal refrigerados acumulam histamina e causam intoxicação. A cadeia do frio é essencial."],["Mel","Composto sobretudo de frutose e glicose. Umidade máxima de 20%. Hidroximetilfurfural (HMF) elevado indica aquecimento ou envelhecimento. Mel não deve ser dado a crianças menores de 1 ano pelo risco de botulismo."]],"qn":112},{"id":"labvida-3","nome":"LabVida em Medicina Veterinária III","sem":3,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"anatpat","nome":"Anatomia Patológica Veterinária","sem":4,"h":65,"area":"morfo","kind":"conteudo","desc":"As lesões: como as células e tecidos adoecem e o que se vê na necropsia e na histopatologia.","tools":[],"top":[["Lesão celular","Reversível: degeneração hidrópica, lipidose. Irreversível: necrose ou apoptose."],["Tipos de necrose","Coagulação (infartos), liquefação (SNC, abscessos), caseosa (tuberculose, linfadenite caseosa) e gordurosa (pâncreas e tecido adiposo)."],["Distúrbios circulatórios","Hiperemia ativa, congestão passiva, edema, hemorragia, trombose e infarto. Fígado em noz-moscada indica congestão passiva crônica."],["Inflamação e neoplasias","Inflamação aguda (neutrófilos) e crônica; granulomatosa com macrófagos epitelioides e células gigantes. Tumores benignos terminam em -oma; malignos epiteliais são carcinomas e mesenquimais, sarcomas."],["Necropsia","Exame externo, abertura sistemática e coleta de fragmentos. Fixação em formol a 10%, com cerca de 10 vezes o volume do tecido."]],"qn":114},{"id":"dip","nome":"Doenças Infecciosas e Parasitárias","sem":4,"h":65,"area":"micro","kind":"conteudo","desc":"As principais doenças transmissíveis de cães, gatos, bovinos, equinos e aves, com diagnóstico e prevenção.","tools":[],"top":[["Cães","Cinomose (Morbillivirus), parvovirose (vômito, diarreia hemorrágica, leucopenia), leptospirose (zoonose; lesão renal e hepática) e erliquiose (trombocitopenia), transmitida por Rhipicephalus sanguineus."],["Gatos","FIV (Lentivirus) e FeLV (Gammaretrovirus), testados em conjunto. A peritonite infecciosa felina resulta de mutação do coronavírus felino entérico."],["Bovinos","Brucelose (vacinação de bezerras de 3 a 8 meses com B19), tuberculose (tuberculinização) e raiva dos herbívoros, transmitida pelo morcego hematófago Desmodus rotundus."],["Equinos","Anemia infecciosa equina, diagnosticada por IDGA (Coggins) ou ELISA, e mormo, causado por Burkholderia mallei. Ambas exigem notificação."],["Aves","Doença de Newcastle e influenza aviária são de notificação obrigatória e ameaçam a avicultura."]],"qn":100},{"id":"farmaco","nome":"Farmacologia e Toxicologia Veterinária","sem":4,"h":66,"area":"clin","kind":"conteudo","desc":"Como os fármacos agem e são eliminados, e como reconhecer e tratar as intoxicações mais comuns.","tools":["dose","conv"],"top":[["Farmacocinética","Absorção, distribuição, metabolização e excreção. Pela via IV a biodisponibilidade é de 100%. São necessárias cerca de 5 meias-vidas para eliminar o fármaco ou atingir o estado de equilíbrio."],["Farmacodinâmica","Agonistas ativam receptores; antagonistas bloqueiam. Índice terapêutico: distância entre dose eficaz e dose tóxica."],["Antimicrobianos e AINEs","β-lactâmicos atuam na parede bacteriana. Aminoglicosídeos são nefrotóxicos e ototóxicos. AINEs inibem a COX; gatos são especialmente sensíveis."],["Intoxicações em cães e gatos","Chocolate (teobromina), xilitol (hipoglicemia e lesão hepática), uvas e passas (lesão renal), paracetamol e permetrina em gatos. Anticoagulantes cumarínicos: antídoto vitamina K1."],["Organofosforados e carência","Organofosforados inibem a acetilcolinesterase e causam sinais muscarínicos; antídoto: atropina. Período de carência é o tempo entre a última dose e o abate ou uso de leite e ovos."]],"qn":120},{"id":"tpoa-carnes","nome":"TPOA: Produtos Cárneos e Lácteos","sem":4,"h":65,"area":"tpoa","kind":"conteudo","desc":"Da transformação do músculo em carne ao leite pasteurizado e aos queijos.","tools":[],"top":[["Músculo em carne","Após o abate, o glicogênio vira ácido lático, o pH cai para cerca de 5,5 a 5,8 e instala-se o rigor mortis."],["Carnes PSE e DFD","PSE (pálida, mole, exsudativa): queda rápida do pH com carcaça quente, comum em suínos estressados. DFD (escura, firme, seca): pH alto por falta de glicogênio antes do abate."],["Produtos cárneos","Curados, embutidos, defumados. O nitrito dá cor rósea e inibe Clostridium botulinum."],["Leite","Leite bovino: cerca de 87% de água, 4,7% de lactose, 3 a 4% de gordura e 3,2% de proteína, das quais cerca de 80% são caseína."],["Tratamento térmico","Pasteurização lenta: 62–65 °C por 30 minutos. Rápida: 72–75 °C por 15–20 segundos. UHT: 130–150 °C por 2–4 segundos. Fosfatase alcalina negativa indica pasteurização eficiente."]],"qn":101},{"id":"ext-viver","nome":"Extensão: Viver Bem de Verdade","sem":4,"h":66,"area":"pratica","kind":"extensao","desc":"Projeto de extensão com a comunidade. Planeje as etapas, registre as ações e acompanhe a carga horária.","tools":[],"top":[],"qn":0},{"id":"labvida-4","nome":"LabVida em Medicina Veterinária IV","sem":4,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"qualidade","nome":"Controle de Qualidade dos Produtos de Origem Animal","sem":5,"h":65,"area":"tpoa","kind":"conteudo","desc":"Ferramentas para garantir alimentos seguros: BPF, APPCC e análises laboratoriais.","tools":[],"top":[["Programas de autocontrole","Boas Práticas de Fabricação (BPF), Procedimentos Padrão de Higiene Operacional (PPHO) e Procedimentos Operacionais Padronizados (POP)."],["APPCC","Sete princípios: análise de perigos, identificação dos pontos críticos de controle (PCC), limites críticos, monitoramento, ações corretivas, verificação e registros."],["Perigos","Físicos (metal, vidro, osso), químicos (resíduos de medicamentos, agrotóxicos) e biológicos (Salmonella, Listeria monocytogenes, que se multiplica sob refrigeração)."],["Análises do leite","Crioscopia detecta adição de água; acidez em graus Dornic; densidade; contagem de células somáticas e contagem bacteriana total."],["Rastreabilidade","Registro do caminho do produto, da origem ao consumidor, para recolhimento rápido em caso de problema."]],"qn":104},{"id":"imagem","nome":"Imaginologia Médico-Veterinária","sem":5,"h":65,"area":"img","kind":"conteudo","desc":"Radiologia, ultrassonografia, tomografia e ressonância: como obter e interpretar imagens com segurança.","tools":[],"top":[["Radiopacidades","Do mais radiotransparente ao mais radiopaco: gás, gordura, tecido mole/líquido, osso e metal."],["Projeções","Sempre pelo menos duas projeções ortogonais, como laterolateral e ventrodorsal. Nomeie pela direção do feixe: entra pela primeira face e sai pela segunda."],["Proteção radiológica","Princípio ALARA: dose tão baixa quanto razoavelmente possível. Tempo, distância e blindagem: avental plumbífero, protetor de tireoide, dosímetro."],["Ultrassonografia","Anecoico (preto): líquido. Hiperecoico (branco): osso, gás, cálculos, com sombra acústica. Reforço acústico posterior aparece atrás de estruturas com líquido, como bexiga e cistos."],["TC e RM","Na tomografia, unidades Hounsfield: água 0 e ar −1000. Ressonância é a melhor para tecidos moles e sistema nervoso central."]],"qn":113},{"id":"patclin","nome":"Patologia Clínica Veterinária","sem":5,"h":65,"area":"clin","kind":"conteudo","desc":"Hemograma, bioquímica e urinálise: coletar certo e interpretar os resultados.","tools":["conv"],"top":[["Coleta e tubos","EDTA (roxo) para hemograma; citrato de sódio (azul) para coagulação; heparina (verde) para bioquímica e hemogasometria; tubo seco para soro. Hemólise e lipemia interferem nos resultados."],["Eritrograma","Hematócrito, hemoglobina, VCM e CHCM. Reticulocitose indica anemia regenerativa em cães e gatos; equinos não liberam reticulócitos no sangue periférico."],["Leucograma","Estresse: neutrofilia, linfopenia, eosinopenia e, no cão, monocitose. Desvio à esquerda: aumento de neutrófilos imaturos (bastonetes), indicando inflamação intensa."],["Bioquímica","ALT: lesão hepatocelular em cães e gatos. FA e GGT: colestase. Ureia e creatinina: função renal; SDMA sobe mais cedo. CK: lesão muscular."],["Urinálise","Densidade urinária acima de 1,030 no cão e 1,035 no gato indica boa capacidade de concentração. Exame físico, químico (fita) e de sedimento."]],"qn":114},{"id":"semiologia","nome":"Semiologia Veterinária","sem":5,"h":65,"area":"clin","kind":"conteudo","desc":"O exame clínico passo a passo: da anamnese ao exame físico de cada sistema.","tools":["vitais"],"top":[["Etapas do exame","Identificação (resenha), anamnese, exame físico geral, exame específico dos sistemas e exames complementares."],["Métodos semiológicos","Inspeção, palpação, percussão, auscultação e olfação."],["Mucosas e TPC","Normocoradas: róseas. Pálidas: anemia ou choque. Ictéricas: hiperbilirrubinemia. Cianóticas: hipoxemia. Congestas: sepse ou hipertermia. TPC normal: até 2 segundos."],["Linfonodos e pulso","No cão palpam-se submandibulares, pré-escapulares e poplíteos. O pulso é palpado na artéria femoral."],["Escore de condição corporal","Na escala de 1 a 9, o ideal é 4 a 5: costelas palpáveis sem excesso de gordura e cintura visível. Em ruminantes, auscultação do rúmen na fossa paralombar esquerda."]],"qn":107},{"id":"ext-conviver","nome":"Extensão: Conviver e Revolucionar","sem":5,"h":66,"area":"pratica","kind":"extensao","desc":"Projeto de extensão com a comunidade. Planeje as etapas, registre as ações e acompanhe a carga horária.","tools":[],"top":[],"qn":0},{"id":"labvida-5","nome":"LabVida em Medicina Veterinária V","sem":5,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"anestesio","nome":"Anestesiologia Veterinária e Técnica Cirúrgica","sem":6,"h":65,"area":"cir","kind":"conteudo","desc":"Anestesia segura do pré-operatório à recuperação e os fundamentos da técnica cirúrgica.","tools":["cri","fluido","dose"],"top":[["Avaliação pré-anestésica","Classificação ASA I a V, exame físico e exames complementares. Jejum alimentar ajustado à espécie e idade."],["Medicação pré-anestésica","Fenotiazínicos (acepromazina), α2-agonistas (xilazina, dexmedetomidina; antagonista atipamezol) e opioides (antagonista naloxona)."],["Indução e manutenção","Indução com propofol, cetamina ou etomidato. Manutenção com isoflurano ou sevoflurano. CAM: concentração que impede movimento em 50% dos animais diante de estímulo nociceptivo."],["Monitoração","Frequência cardíaca e respiratória, SpO2 acima de 95%, EtCO2 de 35 a 45 mmHg, pressão arterial média acima de 60–70 mmHg e temperatura."],["Técnica cirúrgica","Tempos cirúrgicos: diérese, hemostasia e síntese. Fios absorvíveis (poliglactina 910, polidioxanona) e não absorvíveis (nylon, polipropileno)."]],"qn":113},{"id":"aves-suinos","nome":"Clínica Médica de Aves e Suídeos","sem":6,"h":65,"area":"clin","kind":"conteudo","desc":"Doenças de produção e de notificação em aves e suínos, com olhar para o lote.","tools":[],"top":[["Aves: vírus","Newcastle (sinais respiratórios e nervosos), influenza aviária, Gumboro (lesa a bolsa de Fabricius e causa imunossupressão) e Marek (herpesvírus que causa linfomas e paralisia)."],["Aves: bactérias e parasitas","Pulorose (Salmonella Pullorum), tifo aviário (Salmonella Gallinarum) e coccidiose por Eimeria."],["Suínos: respiratórias","Pneumonia enzoótica (Mycoplasma hyopneumoniae), pleuropneumonia (Actinobacillus pleuropneumoniae) e rinite atrófica (Pasteurella multocida toxigênica com Bordetella bronchiseptica)."],["Suínos: sistêmicas","Circovirose (PCV2), erisipela (Erysipelothrix rhusiopathiae, com lesões cutâneas em losango), colibacilose neonatal e as pestes suínas clássica e africana, de notificação obrigatória."],["Medicina de lote","Diagnóstico por necropsias, índices zootécnicos e biosseguridade; tratamento e vacinação pensados para o grupo."]],"qn":100},{"id":"inspecao","nome":"Inspeção de Produtos de Origem Animal","sem":6,"h":65,"area":"tpoa","kind":"conteudo","desc":"Legislação, abate humanitário e a inspeção que garante carne segura para o consumidor.","tools":[],"top":[["Legislação","O RIISPOA (Decreto 9.013/2017) regula a inspeção. Serviços: SIF (federal, MAPA), SIE (estadual) e SIM (municipal). O SISBI-POA dá equivalência para venda interestadual."],["Pré-abate","Descanso e jejum antes do abate e exame ante mortem para identificar animais doentes ou feridos."],["Abate humanitário","Insensibilização (pistola de dardo cativo em bovinos, eletronarcose em suínos e aves) seguida de sangria rápida."],["Exame post mortem","Linhas de inspeção examinam cabeça, vísceras e carcaça. Destinos: liberação, aproveitamento condicional ou condenação."],["Zoonoses no abate","Cisticercose bovina (Cysticercus bovis, larva de Taenia saginata, em masseter, coração, língua e diafragma), tuberculose e hidatidose."]],"qn":103},{"id":"medprev","nome":"Medicina Preventiva e Esp. Médicas","sem":6,"h":65,"area":"saude","kind":"conteudo","desc":"Epidemiologia aplicada, testes diagnósticos e estratégias de prevenção para animais e populações.","tools":["teste"],"top":[["Medidas de frequência","Prevalência: casos existentes ÷ população em um momento. Incidência: casos novos em um período. Letalidade: óbitos ÷ doentes. Mortalidade: óbitos ÷ população."],["Cadeia epidemiológica","Fonte de infecção, via de eliminação, via de transmissão, porta de entrada e hospedeiro suscetível. Interromper qualquer elo previne a doença."],["Níveis de prevenção","Primária: evitar a doença (vacina). Secundária: diagnóstico precoce. Terciária: reduzir sequelas."],["Testes diagnósticos","Sensibilidade: detecta os doentes (poucos falsos-negativos). Especificidade: reconhece os sadios (poucos falsos-positivos). Valores preditivos dependem da prevalência."],["Vacinação e vigilância","Protocolos para cães (polivalente e antirrábica) e gatos. Imunidade de rebanho. Doenças de notificação obrigatória ao serviço veterinário oficial."]],"qn":107},{"id":"ext-futuros","nome":"Extensão: Futuros que Importam","sem":6,"h":66,"area":"pratica","kind":"extensao","desc":"Projeto de extensão com a comunidade. Planeje as etapas, registre as ações e acompanhe a carga horária.","tools":[],"top":[],"qn":0},{"id":"labvida-6","nome":"LabVida em Medicina Veterinária VI","sem":6,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"clin-eq-rum","nome":"Clínica Médica de Equídeos e Ruminantes","sem":7,"h":65,"area":"clin","kind":"conteudo","desc":"Síndrome cólica, doenças metabólicas da vaca leiteira e enfermidades de rebanho.","tools":["fluido","dose"],"top":[["Síndrome cólica","Avaliar frequência cardíaca, dor, motilidade intestinal, sondagem nasogástrica e palpação retal. Refluxo nasogástrico sugere obstrução do intestino delgado."],["Doenças equinas","Laminite e garrotilho (Streptococcus equi subsp. equi, com abscessos em linfonodos submandibulares e retrofaríngeos)."],["Distúrbios ruminais","Acidose ruminal por excesso de carboidratos de fermentação rápida. Timpanismo espumoso (leguminosas) ou gasoso (obstrução)."],["Doenças do periparto","Hipocalcemia puerperal (febre do leite), tratada com cálcio IV. Cetose. Deslocamento de abomaso, mais frequente à esquerda, com som de ping à percussão-auscultação."],["Tristeza parasitária bovina","Complexo de Babesia bovis, Babesia bigemina e Anaplasma marginale, transmitidos pelo carrapato-do-boi: anemia, febre e icterícia."]],"qn":104},{"id":"clin-peq","nome":"Clínica Médica e Terapêutica em Pequenos Animais","sem":7,"h":65,"area":"clin","kind":"conteudo","desc":"As doenças mais vistas na rotina de cães e gatos e como tratá-las.","tools":["dose","fluido","cri","ner"],"top":[["Endocrinologia","Diabetes mellitus (cães dependem de insulina; gatos parecem o tipo 2 humano e podem entrar em remissão). Hipotireoidismo no cão, hipertireoidismo no gato idoso e hiperadrenocorticismo no cão."],["Nefrologia","Doença renal crônica estadiada pela IRIS com creatinina e SDMA, subestadiada por proteinúria e pressão arterial."],["Cardiologia","Doença mixomatosa da valva mitral em cães pequenos idosos, cardiomiopatia dilatada em raças grandes e cardiomiopatia hipertrófica em gatos."],["Dermatologia","Dermatite atópica, dermatite alérgica à picada de pulga (DAPP), piodermites, malasseziose e sarnas."],["Terapêutica","Fluidoterapia individualizada, uso racional de antimicrobianos guiado por cultura, analgesia multimodal e manejo nutricional."]],"qn":113},{"id":"clin-repro","nome":"Clínica Reprodutiva em Animais","sem":7,"h":65,"area":"clin","kind":"conteudo","desc":"Ciclos reprodutivos, diagnóstico de gestação, biotecnologias e afecções do trato reprodutivo.","tools":[],"top":[["Ciclo estral","Proestro, estro, metaestro e diestro; anestro nas espécies sazonais ou monoéstricas. O corpo lúteo produz progesterona; a PGF2α causa luteólise."],["Diferenças entre espécies","Vaca: poliéstrica anual, ciclo de 21 dias. Égua: poliéstrica sazonal de dias longos. Ovelha e cabra: sazonais de dias curtos. Cadela: monoéstrica. Gata: ovulação induzida."],["Diagnóstico de gestação","Palpação retal e ultrassonografia em grandes animais; ultrassonografia e radiografia (esqueleto fetal) em pequenos."],["Afecções","Piometra na cadela, geralmente no diestro, é emergência. Distocias, retenção de placenta e endometrites."],["Biotecnologias","Exame andrológico (motilidade, morfologia, circunferência escrotal), inseminação artificial e IATF com progesterona, estradiol e PGF2α."]],"qn":105},{"id":"saude-col","nome":"Medicina Veterinária e Saúde Coletiva","sem":7,"h":65,"area":"saude","kind":"conteudo","desc":"O veterinário na saúde pública: zoonoses, vigilância e Saúde Única.","tools":[],"top":[["Saúde Única","Integra saúde humana, animal e ambiental. A maioria das doenças emergentes em humanos tem origem animal."],["Zoonoses prioritárias","Raiva, leptospirose, leishmaniose, toxoplasmose, brucelose, tuberculose e esporotricose (Sporothrix brasiliensis, transmitida sobretudo por gatos)."],["Vigilância","Vigilância epidemiológica, sanitária e ambiental. Notificação de agravos e investigação de surtos."],["Atuação no SUS","O médico-veterinário integra equipes multiprofissionais da Atenção Primária e atua em unidades de vigilância de zoonoses."],["Controle populacional e alimentos","Castração, guarda responsável, identificação de animais e segurança dos alimentos de origem animal."]],"qn":104},{"id":"ext-amanha","nome":"Extensão: O Amanhã Começa Aqui","sem":7,"h":66,"area":"pratica","kind":"extensao","desc":"Projeto de extensão com a comunidade. Planeje as etapas, registre as ações e acompanhe a carga horária.","tools":[],"top":[],"qn":0},{"id":"labvida-7","nome":"LabVida em Medicina Veterinária VII","sem":7,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"cir-comp","nome":"Clínica Cirúrgica de Animais de Companhia","sem":8,"h":65,"area":"cir","kind":"conteudo","desc":"Cirurgias de tecidos moles e ortopedia em cães e gatos.","tools":["dose","fluido"],"top":[["Cirurgias eletivas","Ovariossalpingo-histerectomia (pedículos ovarianos, ligamento suspensor e corpo uterino) e orquiectomia."],["Tecidos moles","Cistotomia para urólitos, enterotomia e enterectomia para corpos estranhos e gastropexia na dilatação-vólvulo gástrica de raças grandes de tórax profundo."],["Ortopedia","Ruptura do ligamento cruzado cranial (teste de gaveta e compressão tibial; técnicas como TPLO), luxação de patela (medial em raças pequenas) e fraturas (placas, pinos, fixadores externos)."],["Cicatrização","Fases inflamatória, proliferativa e de remodelamento."],["Classificação de feridas cirúrgicas","Limpa, limpa-contaminada (abertura controlada de víscera oca), contaminada e suja ou infectada."]],"qn":133},{"id":"cir-prod","nome":"Clínica Cirúrgica de Animais de Produção","sem":8,"h":65,"area":"cir","kind":"conteudo","desc":"Procedimentos cirúrgicos em ruminantes, equinos e suínos, muitas vezes no campo.","tools":["dose"],"top":[["Anestesia local em ruminantes","Bloqueio paravertebral, em L invertido e epidural permitem cirurgias com o animal em estação."],["Cesariana e laparotomias","Cesariana bovina geralmente pelo flanco esquerdo com o animal em estação. Rumenotomia para corpos estranhos."],["Reticulopericardite traumática","Corpo estranho metálico perfura o retículo e pode atingir o pericárdio. Ímãs ruminais previnem."],["Deslocamento de abomaso","Correção por omentopexia ou abomasopexia."],["Outros procedimentos","Castração, descorna, casqueamento e tratamento de afecções podais, como a dermatite digital. Cólica equina cirúrgica por laparotomia mediana ventral."]],"qn":117},{"id":"silvestres","nome":"Clínica Médica e Cirúrgica de Animais Silvestres","sem":8,"h":65,"area":"clin","kind":"conteudo","desc":"Aves, répteis e pequenos mamíferos: particularidades de manejo, nutrição e terapêutica.","tools":["dose"],"top":[["Legislação","Fauna silvestre nativa, exótica e doméstica. Autorização ambiental para manter animais. CETAS recebem animais apreendidos ou resgatados."],["Aves","Muitos psitacídeos não têm dimorfismo sexual: sexagem por DNA. Dieta só de sementes causa hipovitaminose A."],["Répteis","Animais ectotérmicos: precisam de faixa de temperatura e de luz UVB. Deficiência de UVB, cálcio ou vitamina D3 causa doença óssea metabólica."],["Coelhos e roedores","Dentes de crescimento contínuo exigem dieta rica em fibra. Estase gastrointestinal é emergência. Antimicrobianos como lincomicina e clindamicina orais podem causar disbiose fatal em coelhos."],["Terapêutica","Doses muitas vezes extrapoladas por escalonamento alométrico; contenção física ou química cuidadosa para reduzir estresse."]],"qn":104},{"id":"neuro","nome":"Neurotraumatologia, Intensivismo e Reabilitação","sem":8,"h":65,"area":"cir","kind":"conteudo","desc":"Exame neurológico, emergências, terapia intensiva e fisioterapia veterinária.","tools":["cri","fluido","dose"],"top":[["Localização neurológica","Segmentos medulares C1–C5, C6–T2, T3–L3 e L4–S3. Lesão de neurônio motor superior: reflexos normais ou aumentados; de neurônio motor inferior: reflexos reduzidos e atrofia."],["Doença do disco intervertebral","Hansen tipo I: extrusão do núcleo pulposo, típica de raças condrodistróficas como Dachshund. Tipo II: protrusão, em cães mais velhos."],["Trauma e emergência","Abordagem XABCDE, triagem e escala de coma de Glasgow modificada (3 a 18) no trauma cranioencefálico."],["Reanimação cardiopulmonar","Diretrizes RECOVER: compressões a 100–120 por minuto em ciclos de 2 minutos e 10 ventilações por minuto no paciente intubado."],["Reabilitação","Crioterapia na fase aguda, termoterapia na crônica, cinesioterapia, hidroterapia e eletroterapia."]],"qn":114},{"id":"ext-cuidar","nome":"Extensão: É Tempo de Cuidar","sem":8,"h":66,"area":"pratica","kind":"extensao","desc":"Projeto de extensão com a comunidade. Planeje as etapas, registre as ações e acompanhe a carga horária.","tools":[],"top":[],"qn":0},{"id":"labvida-8","nome":"LabVida em Medicina Veterinária VIII","sem":8,"h":8,"area":"pratica","kind":"labvida","desc":"Vivências práticas do semestre: registre cada atividade, confira a biossegurança e acompanhe suas horas.","tools":[],"top":[],"qn":0},{"id":"tcc","nome":"TCC em Medicina Veterinária","sem":8,"h":66,"area":"pratica","kind":"tcc","desc":"Do tema à defesa: etapas, estrutura do trabalho e diário de orientação.","tools":[],"top":[],"qn":0},{"id":"internato","nome":"Internato em Medicina Veterinária","sem":9,"h":166,"area":"pratica","kind":"estagio","desc":"Registre casos acompanhados, horas cumpridas e competências desenvolvidas.","tools":[],"top":[],"qn":0},{"id":"estagio","nome":"Estágio Supervisionado Externo em Medicina Veterinária","sem":10,"h":0,"area":"pratica","kind":"estagio","desc":"Registre casos acompanhados, horas cumpridas e competências desenvolvidas.","tools":[],"top":[],"qn":0}];

 if(k==='flash'){W.deck=shuffle([...BK.q]);W.pos=0;P.innerHTML=`<div class="flash"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Virar cartão"><div class="face"><div class="tag">Pergunta</div><h3 id="fq"></h3><p class="note">Toque para ver a resposta</p></div><div class="face back"><div class="tag" style="color:#fff;opacity:.8">Resposta</div><h3 id="fa"></h3><p id="fx" style="margin:12px 0 0;opacity:.9"></p><p id="fs" style="margin:10px 0 0;font-size:13px;opacity:.85"></p></div></div>
  <div class="ctrls"><button id="fp">Anterior</button><button id="ff" class="pri">Virar</button><button id="fn">Próximo</button><button id="fm">Embaralhar</button></div><p class="note" style="text-align:center" id="fpos"></p></div>`;
  const show=()=>{const q=W.deck[W.pos];$('#fc').classList.remove('flip');$('#fq').textContent=q[0];$('#fa').textContent=q[1];$('#fx').textContent=q[3];$('#fs').textContent='Onde estudar: '+BK.refs[q[4]]+' — '+q[5];$('#fpos').textContent=`Cartão ${W.pos+1} de ${W.deck.length}`},flip=()=>$('#fc').classList.toggle('flip');
  $('#fc').onclick=flip;$('#ff').onclick=flip;$('#fc').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
  $('#fn').onclick=()=>{W.pos=(W.pos+1)%W.deck.length;show()};$('#fp').onclick=()=>{W.pos=(W.pos-1+W.deck.length)%W.deck.length;show()};$('#fm').onclick=()=>{shuffle(W.deck);W.pos=0;show()};show()}
 if(k==='quiz'){P.innerHTML='<div class="flash"><div class="card" id="qz"></div></div>';quizSetup()}
 if(k==='banco'){P.innerHTML=`<div class="card" style="margin-bottom:16px"><div class="grid2"><label>Buscar<input id="bq" type="search" placeholder="Palavra da pergunta ou resposta"></label><label>Livro<select id="br"><option value="-1">Todos os livros</option>${BK.refs.map((r,i)=>`<option value="${i}">${esc(r)}</option>`).join('')}</select></label></div><p class="note" id="bc"></p></div><div id="bl" class="log"></div>`;
  const draw=()=>{const q=norm($('#bq').value),r=+$('#br').value,L=BK.q.filter(x=>(r<0||x[4]===r)&&(!q||norm(x[0]+' '+x[1]+' '+x[5]).includes(q)));$('#bc').textContent=`${L.length} de ${BK.q.length} questões`;
   $('#bl').innerHTML=L.slice(0,200).map(x=>`<details class="entry" style="display:block"><summary style="cursor:pointer;font-weight:600;min-height:28px">${esc(x[0])}</summary><p style="margin:8px 0 0"><b>${esc(x[1])}</b> — ${esc(x[3])}</p><p class="tag" style="margin:6px 0 0">${esc(BK.refs[x[4]])} — ${esc(x[5])}</p></details>`).join('')||'<div class="empty">Nenhuma questão encontrada.</div>'};
  $('#bq').oninput=draw;$('#br').onchange=draw;draw()}
 if(k==='tools'){P.innerHTML=toolsPanel(d);bindTools()}
 if(k==='notas'){P.innerHTML=`<div class="card"><label>Suas anotações sobre ${esc(d.nome)}<textarea id="nt" style="min-height:340px" placeholder="Resumos de aula, dúvidas para levar ao professor, mnemônicos...">${esc(s.notes||'')}</textarea></label><div class="saved" id="nsv"></div></div>`;
  let t;$('#nt').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{const o=S(d.id);o.notes=e.target.value;save(d.id,o);$('#nsv').textContent='Salvo neste navegador'},400)}}
 if(k==='plano'){P.innerHTML=planPanel(d);const n=PLAN[d.kind].i.length;
  $$('[data-ck]').forEach(c=>c.onchange=()=>{const o=S(d.id),i=+c.dataset.ck;o.checks=(o.checks||[]).filter(x=>x!==i);if(c.checked)o.checks.push(i);save(d.id,o);$('#ckbar').style.width=o.checks.length/n*100+'%';$('#cktxt').textContent=`${o.checks.length} de ${n} concluídos`});
  const g=$('[data-goal]');if(g){let t;g.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{const o=S(d.id);o.goal=g.value;save(d.id,o);$('#gsv').textContent='Salvo neste navegador'},400)}}}
 if(k==='registro'){P.innerHTML=logPanel(d);
  $('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o=S(d.id);(o.log=o.log||[]).push(Object.fromEntries(f));o.log.sort((a,b)=>a.dt<b.dt?-1:1);save(d.id,o);openTab('registro');updStats()};
  $$('[data-del]').forEach(b=>b.onclick=()=>{const o=S(d.id);o.log.splice(+b.dataset.del,1);save(d.id,o);openTab('registro');updStats()});
  const m=$('#meta');if(m)m.onchange=()=>{const o=S(d.id);o.meta=m.value;save(d.id,o);openTab('registro');updStats()}}
}
function updStats(){const d=W.d,s=S(d.id),b=$$('.hstats b');if(d.kind==='conteudo'){b[0].textContent=`${(s.done||[]).length}/${d.top.length}`;b[2].textContent=s.bestp!=null?Math.round(s.bestp*100)+'%':'—';b[3].textContent=(s.seen||[]).length}else{b[0].textContent=fmt(hours(d))+' h';b[1].textContent=target(d)?target(d)+' h':'—';b[2].textContent=(s.log||[]).length}}

/* ---------- quiz ---------- */
function quizSetup(){const BK=BANKS[W.d.id],n=BK.q.length,seen=new Set(S(W.d.id).seen||[]),unseen=BK.q.filter(q=>!seen.has(q[0])).length;
 $('#qz').innerHTML=`<h2 style="font-size:24px">Montar quiz</h2><p class="note">${n} questões no banco · ${n-unseen} já respondidas · ${unseen} inéditas para você</p>
 <div class="grid2" style="margin-top:12px"><label>Número de questões<select id="qnum">${[10,20,50,100].filter(x=>x<=n||x===10).map(x=>`<option value="${Math.min(x,n)}"${x===Math.min(20,n)?' selected':''}>${Math.min(x,n)}</option>`).join('')}</select></label>
 <label>Livro<select id="qref"><option value="-1">Todos</option>${BK.refs.map((r,i)=>`<option value="${i}">${esc(r)}</option>`).join('')}</select></label></div>
 <label class="chk"><input type="checkbox" id="qnew"${unseen?' checked':''}>Priorizar questões que ainda não respondi</label><div class="ctrls" style="justify-content:flex-start"><button class="pri" id="qgo">Começar</button></div>`;
 $('#qgo').onclick=()=>{const r=+$('#qref').value,m=+$('#qnum').value;let pool=shuffle(BK.q.filter(q=>r<0||q[4]===r));if($('#qnew').checked)pool.sort((a,b)=>seen.has(a[0])-seen.has(b[0]));startQuiz(pool.slice(0,m))}}
function startQuiz(qs){W.qz={qs,i:0,ok:0,miss:[]};askQ()}
function askQ(){const z=W.qz,q=z.qs[z.i],n=z.qs.length,opts=shuffle([q[1],...q[2]]);
 $('#qz').innerHTML=`<div class="tag">Questão ${z.i+1} de ${n} · Acertos: ${z.ok}</div><div class="bar"><i style="width:${z.i/n*100}%"></i></div><h2 style="font-size:clamp(21px,3vw,26px)">${esc(q[0])}</h2>
 <div class="opts">${opts.map((o,i)=>`<button data-o="${i}">${esc(o)}</button>`).join('')}</div><p class="note" id="qx" aria-live="polite"></p><div class="ctrls" id="qn"></div>`;
 $$('.opts button').forEach(b=>b.onclick=()=>{const right=opts[+b.dataset.o]===q[1];if(right)z.ok++;else z.miss.push(q);
  $$('.opts button').forEach(x=>{x.disabled=true;if(opts[+x.dataset.o]===q[1])x.classList.add('right')});if(!right)b.classList.add('wrong');
  $('#qx').innerHTML=`<b style="color:var(${right?'--ok':'--acc'})">${right?'Correto!':'Resposta: '+esc(q[1])+'.'}</b> ${esc(q[3])}<br><span style="display:block;margin-top:6px">Onde estudar: <b>${esc(BANKS[W.d.id].refs[q[4]])}</b> — ${esc(q[5])}</span>`;
  {const o=S(W.d.id),sn=new Set(o.seen||[]);sn.add(q[0]);o.seen=[...sn];save(W.d.id,o)}
  $('#qn').innerHTML=`<button class="pri" id="qg">${z.i+1<n?'Próxima':'Ver resultado'}</button>`;$('#qg').onclick=()=>{z.i++;z.i<n?askQ():endQ()};$('#qg').focus()})}
function endQ(){const z=W.qz,n=z.qs.length,o=S(W.d.id);o.bestp=Math.max(o.bestp??0,z.ok/n);save(W.d.id,o);updStats();const BK=BANKS[W.d.id];
 $('#qz').innerHTML=`<div class="tag">Resultado</div><div class="big">${z.ok}<small>de ${n}</small></div><p class="note">Seu melhor aproveitamento nesta disciplina: ${Math.round(o.bestp*100)}%</p>
 ${z.miss.length?`<h3 style="margin-top:18px;font-size:20px">Para revisar</h3>${z.miss.map(q=>`<div class="row" style="display:block"><b style="white-space:normal">${esc(q[0])}</b><br>${esc(q[1])} <span class="note">— ${esc(q[3])}</span><br><span class="tag">${esc(BK.refs[q[4]])} — ${esc(q[5])}</span></div>`).join('')}`:'<p>Gabaritou! Nenhuma questão para revisar.</p>'}
 <div class="ctrls"><button class="pri" id="qr">Novo quiz</button><button id="qf">Ir para os flashcards</button></div>`;$('#qr').onclick=quizSetup;$('#qf').onclick=()=>openTab('flash')}

/* ---------- rotas ---------- */
function route(){const h=location.hash.slice(1);const d=h.startsWith('d-')&&byId[h.slice(2)];d?worldView(d):mapView()}
addEventListener('hashchange',()=>{route();if(!location.hash.startsWith('#d-'))scrollTo(0,0)});
route();
}
</script>
